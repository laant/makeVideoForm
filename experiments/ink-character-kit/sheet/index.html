<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <script src="ink-theater.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "InkKo"; src: url("assets/NanumPenScript-Regular.ttf") format("truetype"); font-display: block; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fcfbf8; }
      #root { position: relative; width: 1920px; height: 1080px; background: #fcfbf8; }
      svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .c { position: absolute; width: 380px; text-align: center; font-family: "InkKo", cursive; font-size: 44px; color: #222; }
      .h { position: absolute; left: 60px; top: 24px; font-family: "InkKo", cursive; font-size: 64px; color: #222; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="h">ink-theater 기본 마스코트 — 포즈 시트 (scale 2)</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var IT = window.InkTheater, svg = document.getElementById("s"), root = document.getElementById("root");
      // 포즈: [이름, 왼손 목표(dx,dy), 오른손 목표(dx,dy), 눈 dx, 눈 scaleY, 몸 dy]  — 좌표는 몸 중심 기준(scale 2)
      var P = [
        ["1 기본(대기)", [-36, 60], [36, 60], 0, 1, 0],
        ["2 오른손 앞으로 뻗기(레버)", [-36, 60], [118, -10], 3, 1, 0],
        ["3 오른손 위로(가리키기·두드리기)", [-36, 60], [70, -110], 2, 1, 0],
        ["4 두 손 위로(으쓱·환호)", [-80, -70], [80, -70], 0, 1, 0],
        ["5 두 손 앞으로 모음(물건 들기)", [-10, 30], [10, 30], 0, 1, 0],
        ["6 아래로 누르기(건반)", [-36, 60], [80, 70], 0, 1, 6],
        ["7 시선 왼쪽 · 걷기 튀김", [-50, 40], [50, 50], -4, 1, -14],
        ["8 눈 깜빡임", [-36, 60], [36, 60], 0, 0.2, 0]
      ];
      P.forEach(function (p, i) {
        var cx = 240 + (i % 4) * 480, cy = 330 + Math.floor(i / 4) * 470 + p[5];
        var M = IT.mascot({ x: cx, y: cy, scale: 2 });
        svg.appendChild(M.g);
        M.reachL([cx + p[1][0], cy + p[1][1]]); M.reachR([cx + p[2][0], cy + p[2][1]]);
        [M.eyeL, M.eyeR].forEach(function (e) { e.setAttribute("cx", +e.getAttribute("cx") + p[3]); e.setAttribute("transform", "translate(0," + (cy - 32) * (1 - p[4]) + ") scale(1," + p[4] + ")"); });
        // 관절 표시(빨간 점) — 어깨·팔꿈치·손, 다리 시작점
        var d = document.createElement("div"); d.className = "c"; d.textContent = p[0];
        d.style.left = (cx - 190) + "px"; d.style.top = (cy + 150 - p[5]) + "px"; root.appendChild(d);
      });
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
