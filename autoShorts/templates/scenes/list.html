<!-- list: 번호 목록. onScreen: { heading, items: [ "텍스트" | { text, at: "word:키워드" } ] } -->
<style>
  .l-head { white-space: pre-line; font-size: 80px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.12; }
  .l-list { display: flex; flex-direction: column; gap: 26px; }
  .l-item { display: flex; align-items: center; gap: 30px; padding: 30px 36px; border-radius: 30px; background: rgba(255,255,255,0.06); }
  .l-num { flex: none; width: 84px; height: 84px; border-radius: 24px; background: var(--accent); color: #111; font-size: 48px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .l-text { font-size: 46px; font-weight: 700; line-height: 1.3; }
</style>
<script>
  const o = S.onScreen;
  const h = H.el("div", "l-head", o.heading || "", stage);
  tl.fromTo(h, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
  const list = H.el("div", "l-list", null, stage);
  const items = (o.items || []).map((it) => (typeof it === "string" ? { text: it } : it));
  const even = H.spread(items.length, 0.5, Math.max(0.6, S.speechEnd - 0.8));
  items.forEach((it, i) => {
    const row = H.el("div", "l-item", null, list);
    H.el("div", "l-num", String(i + 1), row);
    H.el("div", "l-text", it.text, row);
    const t = H.at(it.at, even[i]);
    tl.fromTo(row, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t);
    tl.fromTo(row.firstChild, { scale: 0.4 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, t + 0.05);
  });
</script>
