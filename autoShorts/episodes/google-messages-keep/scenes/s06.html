<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #faf4e8; }
      :root {
        --bg: #faf4e8; --fg: #102849; --accent: #efbd35; --muted: #68707a;
        --font: Keep, sans-serif;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--bg); color: var(--fg); font-family: var(--font);
        word-break: keep-all;
      }
      .layer { position: absolute; inset: 0; }
      .glow {
        position: absolute; width: 900px; height: 900px; border-radius: 50%;
        filter: blur(140px); opacity: 0.22;
      }
      .glow.a { background: var(--accent); left: -300px; top: 120px; }
      .glow.b { background: #5b8cff; right: -360px; bottom: 260px; opacity: 0.16; }
      /* onScreen.bgImage: 배경 그림 + 글자 가독성용 그라데이션 (onScreen.bgDim 0~1 로 어둡기 조절) */
      .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
      .bgshade { position: absolute; inset: 0; }
      /* 안전 영역: 상단 250px, 하단 420px 은 플랫폼 UI 가 가림 */
      .stage {
        position: absolute; left: 90px; right: 90px; top: 260px; bottom: 560px;
        display: flex; flex-direction: column; justify-content: center; gap: 36px;
      }
      .progress { position: absolute; left: 0; top: 0; height: 10px; width: 1080px; background: var(--accent); transform-origin: 0 50%; }
      .captions { position: absolute; left: 70px; right: 70px; bottom: 440px; height: 120px; }
      .cap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        text-align: center; font-size: 58px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em;
        color: #fff; opacity: 0;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 0, 0, 0.6);
      }
      .cap em { font-style: normal; color: var(--accent); }

rd{top:1110px}.s03 .title{top:990px;background:#faf4e8ee;border-radius:20px;padding:20px;font-size:60px}.s03 .card{top:1110px}.s07 .card{top:1245px}.s06 .card .line{font-size:35px}
    </style>

  <body>
    <!-- autoshorts:custom keep-couple-v1 -->
    <div id="root" data-composition-id="s06" data-start="0" data-duration="7.3" data-width="1080" data-height="1920">
      <div id="s06-bg" class="layer bg-layer clip" data-start="0" data-duration="7.3">
        <img class="photo" src="media/permissions.png"><div class="shade"></div>
        <div class="glow a"></div>
        <div class="glow b"></div>
      </div>
      <div id="s06-content" class="layer content clip" data-start="0" data-duration="7.3">
        <div class="stage"></div>
        <div class="captions"></div>
        <div class="progress"></div>
      </div>
    </div>
    <script>
      // ── 씬 데이터 (build-scenes.js 가 주입) ─────────────────────
      const S = {"id": "s06", "onScreen": {"title": "같이 쓰는 장보기 메모", "showCaptions": false}, "highlight": [], "showCaptions": false, "words": [{"text": "공유를", "start": 0.09, "end": 0.65}, {"text": "끝내려면", "start": 0.65, "end": 1.95}, {"text": "킵에서", "start": 1.95, "end": 2.6}, {"text": "공동작업자를", "start": 2.6, "end": 3.38}, {"text": "확인하고,", "start": 3.38, "end": 3.96}, {"text": "제외할", "start": 4.05, "end": 4.32}, {"text": "사람을", "start": 4.32, "end": 4.69}, {"text": "삭제한", "start": 4.69, "end": 5.3}, {"text": "뒤", "start": 5.41, "end": 5.42}, {"text": "저장하세요.", "start": 5.48, "end": 6.01}], "speechEnd": 6.483605, "duration": 7.3, "renderDuration": 7.3, "globalStart": 26.066667, "total": 38.866667};

      // ── 공통 헬퍼: 결정적(deterministic) 로직만 사용 ─────────────
      const H = {
        el(tag, cls, text, parent) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          if (parent) parent.appendChild(e);
          return e;
        },
        /** "word:비교" / 숫자 / "start" / "end" → 씬 기준 초 */
        at(spec, fallback = 0) {
          if (typeof spec === "number") return spec;
          if (spec === "start" || spec == null) return fallback;
          if (spec === "end") return S.speechEnd;
          const key = String(spec).replace(/^word:/, "");
          const w = S.words.find((w) => w.text.includes(key));
          return w ? w.start : fallback;
        },
        /** start~end 사이에 n개를 고르게 분배 */
        spread(n, start, end) {
          if (n <= 1) return [start];
          return Array.from({ length: n }, (_, i) => start + ((end - start) * i) / (n - 1));
        },
        /** 단어를 한 줄 ~maxChars 로 묶어 자막 생성. S.highlight 단어는 강조 */
        captions(tl, maxChars = 14) {
          const box = document.querySelector(".captions");
          const chunks = [];
          let cur = [];
          for (const w of S.words) {
            const len = cur.reduce((n, x) => n + x.text.length + 1, 0);
            if (cur.length && len + w.text.length > maxChars) { chunks.push(cur); cur = []; }
            cur.push(w);
            if (/[.?!,]$/.test(w.text)) { chunks.push(cur); cur = []; }
          }
          if (cur.length) chunks.push(cur);
          const hl = S.highlight || [];
          chunks.forEach((c, i) => {
            const d = H.el("div", "cap", null, box);
            const line = H.el("span", null, null, d); // flex 컨테이너 직속 텍스트노드는 공백이 사라지므로 span 으로 감쌈
            c.forEach((w, j) => {
              const t = w.text.replace(/[.,]$/, "");
              const node = hl.some((h) => t.includes(h)) ? H.el("em", null, t) : document.createTextNode(t);
              line.appendChild(node);
              if (j < c.length - 1) line.appendChild(document.createTextNode(" "));
            });
            const start = c[0].start;
            const end = i < chunks.length - 1 ? chunks[i + 1][0].start : Math.min(c[c.length - 1].end + 0.4, S.duration);
            tl.fromTo(d, { opacity: 0, y: 12, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "power2.out" }, start);
            tl.set(d, { opacity: 0 }, end);
          });
        },
        /**
         * 규정 태극기 SVG (행정안전부 도안: 3:2, 태극 지름=세로/2, 괘 길이 D/2·두께 D/12·간격 D/24,
         * 태극-괘 거리 D/4, 작은 원 중심은 건-곤 대각선 위(빨강 좌상·파랑 우하), 건 좌상·감 우상·리 좌하·곤 우하)
         */
        taegukgi(parent, width) {
          const NS = "http://www.w3.org/2000/svg";
          const mk = (tag, attrs, into) => {
            const e = document.createElementNS(NS, tag);
            for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
            if (into) into.appendChild(e);
            return e;
          };
          const W = width, Hh = (width * 2) / 3, D = Hh / 2, r = D / 2;
          const a = (Math.atan2(Hh, W) * 180) / Math.PI;
          const svg = mk("svg", { width: W, height: Hh, viewBox: `0 0 ${W} ${Hh}`, class: "taegukgi" }, parent);
          mk("rect", { width: W, height: Hh, fill: "#fff" }, svg);
          const tg = mk("g", { transform: `translate(${W / 2},${Hh / 2}) rotate(${a})` }, svg);
          mk("circle", { r, fill: "#0047A0" }, tg);
          mk("path", { d: `M ${-r} 0 A ${r} ${r} 0 0 1 ${r} 0 Z`, fill: "#CD2E3A" }, tg);
          mk("circle", { cx: -r / 2, r: r / 2, fill: "#CD2E3A" }, tg);
          mk("circle", { cx: r / 2, r: r / 2, fill: "#0047A0" }, tg);
          const L = D / 2, th = D / 12, g = D / 24, dist = r + D / 4 + D / 6;
          const rad = (a * Math.PI) / 180;
          // [괘, 방향(x,y), 막대 회전] — split=true 인 효는 가운데가 끊긴 음효
          const gwae = [
            [[false, false, false], -1, -1, a + 90], // 건 좌상
            [[true, true, true], 1, 1, a + 90], // 곤 우하
            [[true, false, true], 1, -1, -a + 90], // 감 우상
            [[false, true, false], -1, 1, -a + 90], // 리 좌하
          ];
          for (const [lines, sx, sy, rot] of gwae) {
            const cg = mk("g", { transform: `translate(${W / 2 + sx * Math.cos(rad) * dist},${Hh / 2 + sy * Math.sin(rad) * dist}) rotate(${rot})` }, svg);
            lines.forEach((split, i) => {
              const y = (i - 1) * (th + g) - th / 2;
              if (!split) mk("rect", { x: -L / 2, y, width: L, height: th, fill: "#000" }, cg);
              else {
                const half = (L - g) / 2;
                mk("rect", { x: -L / 2, y, width: half, height: th, fill: "#000" }, cg);
                mk("rect", { x: g / 2, y, width: half, height: th, fill: "#000" }, cg);
              }
            });
          }
          return svg;
        },
        /** 한 글자씩 타이핑 (span opacity 스텝) */
        type(tl, parent, text, start, cps = 22) {
          const spans = [...text].map((ch) => H.el("span", null, ch, parent));
          spans.forEach((s, i) => {
            tl.set(s, { opacity: 0 }, 0);
            tl.set(s, { opacity: 1 }, start + i / cps);
          });
          return start + spans.length / cps;
        },
      };

      const tl = gsap.timeline({ paused: true });
      const stage = document.querySelector(".stage");

      // 배경 드리프트 + 진행 바 (전체 영상 기준)
      tl.fromTo(".glow.a", { x: 0, y: 0 }, { x: 160, y: 120, duration: S.renderDuration, ease: "none" }, 0);
      tl.fromTo(".glow.b", { x: 0, y: 0 }, { x: -140, y: -160, duration: S.renderDuration, ease: "none" }, 0);
      tl.fromTo(
        ".progress",
        { scaleX: S.globalStart / S.total },
        { scaleX: Math.min(1, (S.globalStart + S.renderDuration) / S.total), duration: S.renderDuration, ease: "none" },
        0,
      );

      // 배경 그림: 느린 줌 인 (Ken Burns)
      const bgImg = document.querySelector(".bgimg");
      if (bgImg) tl.fromTo(bgImg, { scale: 1.03 }, { scale: 1.1, duration: S.renderDuration, ease: "none" }, 0);

      // ── 템플릿 본문 ──────────────────────────────────────────
      document.getElementById("root").classList.add("s06");stage.innerHTML="<div class=\"s06\"><div class=\"eyebrow\">GOOGLE 메시지 × KEEP</div><div class=\"title\">공유를 끝내려면</div><div class=\"card\"><h2 class=\"a\">Keep → 공동작업자</h2><div class=\"line b\">제외할 사람 삭제</div><div class=\"line c\">→ 저장</div><div class=\"line\" style=\"font-size:26px\">메모 전체 삭제와 구분하세요</div></div><div class=\"note\">Keep → 작업 → 공동작업자 → 사용자 삭제 → 저장</div></div>";
tl.fromTo('.photo',{scale:1},{scale:1.035,duration:S.duration,ease:'none'},0);tl.fromTo('.card',{y:22,opacity:0},{y:0,opacity:1,duration:.35,ease:'power3.out'},.12);tl.fromTo('.a',{opacity:0,y:15},{opacity:1,y:0,duration:.25,ease:'power3.out'},H.at('word:공동작업자'));tl.fromTo('.b',{opacity:0,y:15},{opacity:1,y:0,duration:.25,ease:'power3.out'},H.at('word:삭제'));tl.fromTo('.c',{opacity:0,y:15},{opacity:1,y:0,duration:.25,ease:'power3.out'},H.at('word:저장'));

      if (S.showCaptions !== false) H.captions(tl);

      window.__timelines = window.__timelines || {};
      window.__timelines["s06"] = tl;
      tl.seek(0);
    </script>
  </body>
