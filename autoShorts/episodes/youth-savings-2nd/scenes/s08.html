      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0f; }

      .cap em { font-style: normal; color: var(--accent); }
      .t-kicker { align-self: flex-start; padding: 14px 28px; border-radius: 999px; background: var(--accent); color: #111; font-size: 40px; font-weight: 800; }
  .t-emoji { font-size: 150px; line-height: 1; }
  .t-title { font-size: 112px; font-weight: 900; line-height: 1.08; letter-spacing: -0.04em; }
  .t-title .line { display: block; transform-origin: 0 50%; }
  .t-sub { white-space: pre-line; font-size: 50px; font-weight: 600; color: var(--muted); line-height: 1.35; }

      const H = {
