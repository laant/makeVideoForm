<!-- verdict: 결론. onScreen: { call, reason?, reasonAt?, forWho?, notFor? } -->
<style>
  .v-call { font-size: 96px; font-weight: 900; line-height: 1.1; letter-spacing: -0.04em; color: var(--accent); }
  .v-reason { white-space: pre-line; font-size: 50px; font-weight: 650; line-height: 1.35; }
  .v-who { display: flex; flex-direction: column; gap: 16px; }
  .v-row { display: flex; gap: 20px; align-items: flex-start; font-size: 42px; font-weight: 700; line-height: 1.3; }
  .v-mark { flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; }
  .v-yes { background: var(--accent); color: #111; }
  .v-no { background: rgba(255,255,255,0.16); color: var(--fg); }
</style>
<script>
  const o = S.onScreen;
  const c = H.el("div", "v-call", o.call || "", stage);
  tl.fromTo(c, { scale: 1.15, y: 26 }, { scale: 1, y: 0, duration: 0.42, ease: "power4.out" }, 0);
  if (o.reason) {
    const r = H.el("div", "v-reason", o.reason, stage);
    tl.fromTo(r, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35 }, H.at(o.reasonAt, 0.6));
  }
  if (o.forWho || o.notFor) {
    const box = H.el("div", "v-who", null, stage);
    const row = (mark, cls, text, at) => {
      const d = H.el("div", "v-row", null, box);
      H.el("div", `v-mark ${cls}`, mark, d);
      H.el("div", null, text, d);
      tl.fromTo(d, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at);
    };
    if (o.forWho) row("O", "v-yes", o.forWho, H.at(o.forWhoAt, 1.2));
    if (o.notFor) row("X", "v-no", o.notFor, H.at(o.notForAt, 1.6));
  }
</script>
