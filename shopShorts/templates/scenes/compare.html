<!-- compare: 2개 비교. onScreen: { heading?, left:{label, items[]}, right:{label, items[]}, rightAt?, verdict?, verdictAt? } -->
<style>
  .c-head { font-size: 68px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.12; }
  .c-cols { display: flex; gap: 24px; }
  .c-col { flex: 1; padding: 30px 28px; border-radius: 30px; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); display: flex; flex-direction: column; gap: 18px; }
  .c-label { font-size: 44px; font-weight: 900; color: var(--accent); }
  .c-item { font-size: 38px; font-weight: 650; line-height: 1.3; }
  .c-verdict { padding: 26px 34px; border-radius: 26px; background: var(--accent); color: #111; font-size: 48px; font-weight: 900; line-height: 1.25; }
</style>
<script>
  const o = S.onScreen;
  if (o.heading) {
    const h = H.el("div", "c-head", o.heading, stage);
    tl.fromTo(h, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
  }
  const cols = H.el("div", "c-cols", null, stage);
  const mk = (side, at) => {
    const col = H.el("div", "c-col", null, cols);
    H.el("div", "c-label", side.label || "", col);
    (side.items || []).forEach((t) => H.el("div", "c-item", t, col));
    tl.fromTo(col, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at);
  };
  mk(o.left || {}, 0.35);
  mk(o.right || {}, H.at(o.rightAt, 0.9));
  if (o.verdict) {
    const v = H.el("div", "c-verdict", o.verdict, stage);
    tl.fromTo(v, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, H.at(o.verdictAt, Math.max(1.3, S.speechEnd - 1)));
  }
</script>
